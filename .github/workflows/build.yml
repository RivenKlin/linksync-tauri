name: build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Build .exe
        run: |
          cd src-tauri
          cargo build --release --bin linksync
          cp target/release/linksync.exe ../LinkSync.exe
      - uses: actions/upload-artifact@v4
        with:
          name: linksync-windows-exe
          path: LinkSync.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Build universal .dmg
        run: tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: linksync-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
