name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_VERSION: "1.0.0"

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64
      - name: Build .exe (x64)
        run: |
          cd src-tauri
          cargo build --release --bin linksync
          New-Item -ItemType Directory -Force -Path ../out | Out-Null
          Copy-Item target/release/linksync.exe "../out/LinkSync-$env:APP_VERSION-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/LinkSync-*-windows-x64.exe
          if-no-files-found: error

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-arm64
      - name: Build .exe (arm64)
        run: |
          cd src-tauri
          cargo build --release --target aarch64-pc-windows-msvc --bin linksync
          New-Item -ItemType Directory -Force -Path ../out | Out-Null
          Copy-Item target/aarch64-pc-windows-msvc/release/linksync.exe "../out/LinkSync-$env:APP_VERSION-windows-arm64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: out/LinkSync-*-windows-arm64.exe
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-arm64
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxrandr-dev \
            libssl-dev \
            patchelf \
            file
      - name: Install tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Build .deb (arm64)
        run: tauri build --bundles deb
      - name: Collect asset
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb "out/LinkSync-${APP_VERSION}-linux-arm64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: out/LinkSync-*-linux-arm64.deb
          if-no-files-found: error

  release:
    needs: [windows-x64, windows-arm64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lR assets
          if gh release view "v${APP_VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v${APP_VERSION}" $(find assets -type f) \
              --clobber --repo "${{ github.repository }}"
            gh release edit "v${APP_VERSION}" \
              --notes-file .github/release-notes.md \
              --latest --repo "${{ github.repository }}"
          else
            gh release create "v${APP_VERSION}" \
              --repo "${{ github.repository }}" \
              --title "LinkSync ${APP_VERSION}" \
              --latest \
              --notes-file .github/release-notes.md \
              $(find assets -type f)
          fi
